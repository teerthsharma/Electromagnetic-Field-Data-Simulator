[workspace]
members = ["crates/em-field-sim"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Teerth Sharma"]
license = "MIT"
repository = "https://github.com/teerthsharma/Electromagnetic-Field-Data-Simulator"

[workspace.dependencies]
libm = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
